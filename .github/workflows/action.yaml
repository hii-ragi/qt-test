name: build-windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Qt ${{ matrix.qt-version }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt-version: '5.15.2'
            qt-major: '5'
            qt-arch: 'win64_msvc2019_64'
          - qt-version: '6.8.3'
            qt-major: '6'
            qt-arch: 'win64_msvc2022_64'
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          arch: ${{ matrix.qt-arch }}

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DQT_VERSION_MAJOR=${{ matrix.qt-major }}

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt runtime
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build/Release/ime-test.exe dist/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --compiler-runtime --no-translations dist/ime-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item README.md dist/

      - name: Smoke test deployed application
        run: |
          foreach ($file in @('ime-test.exe', 'Qt${{ matrix.qt-major }}Core.dll', 'Qt${{ matrix.qt-major }}Gui.dll', 'Qt${{ matrix.qt-major }}Widgets.dll', 'platforms/qwindows.dll')) {
            if (!(Test-Path "dist/$file")) { throw "Missing deployment file: $file" }
          }
          # Ensure the executable uses deployed Qt files rather than the SDK.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and !$_.StartsWith($env:QT_ROOT_DIR, [StringComparison]::OrdinalIgnoreCase) }) -join ';'
          $env:QT_PLUGIN_PATH = ''
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = ''
          $env:QT_QPA_PLATFORM = 'windows'
          foreach ($kind in @('plain', 'line', 'text')) {
            & ./dist/ime-test.exe $kind --smoke-test
            if ($LASTEXITCODE -ne 0) { throw "Startup failed: $kind ($LASTEXITCODE)" }
          }

      - name: Package release asset
        run: Compress-Archive -Path dist/* -DestinationPath "ime-test-windows-qt-${{ matrix.qt-version }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ime-test-windows-qt-${{ matrix.qt-version }}
          path: ime-test-windows-qt-${{ matrix.qt-version }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: ime-test-windows-qt-*
          path: release-assets
          merge-multiple: true

      - name: Create release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_REF_TYPE: ${{ github.ref_type }}
          BUILD_REF_NAME: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          assets=(release-assets/ime-test-windows-qt-5.15.2.zip release-assets/ime-test-windows-qt-6.8.3.zip)
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          if [[ "$BUILD_REF_TYPE" == "tag" ]]; then
            tag="$BUILD_REF_NAME"
            options=(--verify-tag)
          else
            tag="build-$BUILD_RUN_ID"
            options=(--target "$BUILD_SHA" --prerelease --latest=false)
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" "${options[@]}" \
              --title "Qt Input Test $tag" \
              --notes "Windows x64 input test builds for Qt 5.15.2 and Qt 6.8.3. Extract each ZIP into a separate directory, keeping all DLLs and the platforms folder. Source commit: $BUILD_SHA."
          fi
